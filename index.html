<script>

        slidedown: {
          prompts: [
            {
              type: "push",
              autoPrompt: true,
              text: {
                actionMessage: "Get medicine reminders from HealthDesk?",
                acceptButton: "Allow",
                cancelButton: "No Thanks"
              },
              delay: { pageViews: 1, timeDelay: 3 }
            }
          ]
        }
      }
    });
  });
</script>
